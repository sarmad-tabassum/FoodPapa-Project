<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      type="x-icon"
      href="../Images/cheif-logo.jpg"
    />
    <title>FoodPapa Orders</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap");

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f5f5;
        color: #2c3e50;
        margin: 0;
        padding: 0;
      }

      .navbar {
        background-color: #ffffff !important;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      .Foodpanda-logo img {
        margin-right: 8px;
      }

      .Foodpanda-logo a {
        font-weight: bold;
        font-size: 1.4rem;
        color: #fd7e14;
        text-decoration: none;
      }

      .nav-link {
        color: #2c3e50 !important;
        font-weight: 500;
      }

      .nav-link.active {
        color: #fd7e14 !important;
      }

      .main-btn,
      .add-btn,
      .btn-primary,
      .btn-warning,
      .btn-danger {
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        transition: all 0.3s ease;
      }

      .main-btn:hover,
      .add-btn:hover,
      .btn-primary:hover,
      .btn-warning:hover,
      .btn-danger:hover {
        background-color: #fd7e14;
        color: #fff;
      }

      #logoutBtn {
        background-color: #fd7e14;
        color: white;
      }

      .admin-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .card {
        border: none;
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }

      .card-title {
        font-weight: 600;
      }

      .card-text {
        font-size: 0.95rem;
        color: #555;
      }

      .modal-content {
        border-radius: 12px;
      }

      .modal-header,
      .modal-footer {
        background-color: #f0f0f0;
      }

      .modal-title {
        color: #2c3e50;
      }

      .form-control {
        border-radius: 6px;
        border: 1px solid #ccc;
        box-shadow: none;
        transition: border 0.3s ease;
      }

      .form-control:focus {
        border-color: #fd7e14;
        box-shadow: 0 0 0 0.1rem rgba(255, 111, 97, 0.25);
      }

      h3 {
        color: #2c3e50;
        border-bottom: 2px solid #fd7e14;
        padding-bottom: 6px;
        margin-bottom: 16px;
      }

      .navbar-nav {
        gap: 30px;
        font-size: 1rem;
      }

      .navbar-nav .nav-link {
        padding: 8px 12px;
      }

      .Foodpanda-logo {
        display: flex;
        align-items: center;
        margin-left: 50 px;
      }

      .card-text {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card.h-100 {
        display: flex;
        flex-direction: column;
      }

      .card-img-top {
        height: 250px;
        object-fit: cover;
      }

      .card-body {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .card-text {
        flex-grow: 1;
        overflow: auto;
        max-height: 100px;
      }

      .small-action-btn {
        padding: 4px 10px;
        font-size: 0.85rem;
        border-radius: 5px;
      }

      .text-orange {
        color: #fd7e14;
      }
      .btn-orange {
        background-color: #fd7e14;
        color: white;
      }
      .btn-orange:hover {
        background-color: #e96b00;
      }
      .dish-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 15px;
      }
    </style>
    <link rel="stylesheet" href="../css/foodpapa-pro.css">\n</head>
  <body class="bg-light">
    <nav
      class="navbar navbar-expand-lg navbar-light bg-light cont-2 p-3 sticky-top"
      id="navbarShadow"
    >
      <div class="container-fluid nav">
        <div class="Foodpanda-logo d-flex align-items-center">
          <img
            src="../Images/cheif-logo.jpg"
            alt="Logo"
            width="40"
            class="me-2"
          />
          <span class="navbar-brand mb-0 h1" style="color: #fd7e14"
            >FoodPapa</span
          >
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link text-dark fw-bold" href="../pages/AdminHome.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link text-dark fw-bold"
                href="../pages/AdminDashboard.html"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-bold"
                style="color: #fd7e14 !important"
                href=""
                >Orders</a
              >
            </li>
          </ul>
          <form class="d-flex">
            <button
              id="logoutBtn"
              class="btn"
              style="background-color: #fd7e14"
              type="button"
            >
              Logout
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h2 class="text-center mb-4">
        User <span style="font-style: italic; color: #fd7e14"> Orders </span>
      </h2>
      <div id="ordersContainer" class="row gy-4"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        onValue,
        remove,
        update,
      } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";
      import {
        getAuth,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBxU04d9_k9VmPtFDlSpEKH94iUWkrOWKs",
        authDomain: "foodpapa-24729.firebaseapp.com",
        databaseURL: "https://foodpapa-24729-default-rtdb.firebaseio.com",
        projectId: "foodpapa-24729",
        storageBucket: "foodpapa-24729.firebasestorage.app",
        messagingSenderId: "573671343924",
        appId: "1:573671343924:web:71cfccd5064e09bbe50761",
        measurementId: "G-8BMFCXJ60K",
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      const auth = getAuth(app);

      const ordersRef = ref(database, "orders");
      const ordersContainer = document.getElementById("ordersContainer");

      onValue(ordersRef, (snapshot) => {
        ordersContainer.innerHTML = "";
        const orders = snapshot.val();
        if (!orders) {
          ordersContainer.innerHTML =
            "<p class='text-center'>No orders found.</p>";
          return;
        }

        for (const userId in orders) {
          for (const orderId in orders[userId]) {
            const order = orders[userId][orderId];
            const date = new Date(order.timestamp).toLocaleString();
            let itemsList = "<ul>";
            order.items.forEach((item) => {
              itemsList += `<li>${item.name} - Rs. ${item.price} (x${
                item.quantity || 1
              })</li>`;
            });
            itemsList += "</ul>";

            const orderCard = document.createElement("div");
            orderCard.className = "col-md-6";
            orderCard.innerHTML = `
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">User: ${
                              order.username || "Unknown User"
                            }</h5>
                            <h6 class="card-subtitle mb-2 text-muted">Email: ${
                              order.email
                            }</h6>
                            <h6 class="card-subtitle mb-2 text-muted">Order Time: ${date}</h6>
                            <p class="card-text">Items: ${itemsList}</p>
                            <p><strong>Status:</strong> ${
                              order.status || "Pending"
                            }</p>
                            <div class="d-flex gap-2">
                              <button class="btn btn-success btn-sm small-action-btn complete-btn">✔</button>
                              <button class="btn btn-danger btn-sm small-action-btn delete-btn">🗑</button>
                          </div>
                        </div>
                    </div>
                `;

            orderCard
              .querySelector(".complete-btn")
              .addEventListener("click", () => {
                update(ref(database, `orders/${userId}/${orderId}`), {
                  status: "Completed",
                })
                  .then(() =>
                    Swal.fire(
                      "Success",
                      "Order marked as completed!",
                      "success"
                    )
                  )
                  .catch((err) => Swal.fire("Error", err.message, "error"));
              });

            orderCard
              .querySelector(".delete-btn")
              .addEventListener("click", () => {
                Swal.fire({
                  title: "Delete this order?",
                  icon: "warning",
                  showCancelButton: true,
                  confirmButtonColor: "#fd7e14",
                  cancelButtonColor: "#6c757d",
                  confirmButtonText: "Yes, delete it",
                }).then((result) => {
                  if (result.isConfirmed) {
                    remove(ref(database, `orders/${userId}/${orderId}`))
                      .then(() =>
                        Swal.fire(
                          "Deleted!",
                          "Order has been removed.",
                          "success"
                        )
                      )
                      .catch((err) => Swal.fire("Error", err.message, "error"));
                  }
                });
              });

            ordersContainer.appendChild(orderCard);
          }
        }
      });

      onAuthStateChanged(auth, (user) => {
        if (!user) {
          Swal.fire({
            icon: "error",
            title: "Access Denied",
            text: "Please login first to access the Admin Orders page.",
            confirmButtonColor: "#fd7e14",
          }).then(() => (window.location.href = "../index.html"));
        }
      });

      document.getElementById("logoutBtn").addEventListener("click", () => {
        Swal.fire({
          title: "Logout?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#fd7e14",
          cancelButtonColor: "#6c757d",
          confirmButtonText: "Yes, logout",
        }).then((result) => {
          if (result.isConfirmed) {
            signOut(auth).then(() => {
              Swal.fire({
                icon: "success",
                title: "Logged Out!",
                text: "You have been logged out successfully.",
                confirmButtonColor: "#fd7e14",
              }).then(() => (window.location.href = "../index.html"));
            });
          }
        });
      });
    </script>
    <script src="../js/foodpapa-motion.js"></script>\n</body>
</html>
