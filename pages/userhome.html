<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      type="x-icon"
      href="../../Main/Images/cheif-logo.jpg"
    />
    <title>FoodPapa | Home</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      body {
        background-color: #f7f7f7;
      }
      .text-orange {
        color: #fd7e14;
      }
      .btn-orange {
        background-color: #fd7e14;
        color: white;
      }
      .btn-orange:hover {
        background-color: #e96b00;
      }
      .dish-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 15px;
      }
      .cart-fixed {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1050;
      }
      .dish-cart img {
        width: 50px;
      }
      .cart-num {
        background-color: red;
        color: white;
        border-radius: 50%;
        padding: 2px 8px;
        position: absolute;
        top: -8px;
        right: -8px;
        font-size: 12px;
      }

      .cart-fixed {
        position: fixed;
        top: 100px;
        right: 40px;
        z-index: 1000;
      }

      .dish-cart {
        position: relative;
        background-color: #fff;
        border-radius: 50%;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        padding: 12px;
        transition: transform 0.3s ease;
      }

      .dish-cart:hover {
        transform: scale(1.05);
      }

      .dish-cart img {
        height: 32px;
        width: 32px;
      }

      .cart-num {
        position: absolute;
        top: -8px;
        right: -8px;
        background-color: #fd7e14;
        color: #fff;
        font-size: 12px;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 50%;
      }

      /* Card hover effect */
      .card:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        transition: all 0.3s ease-in-out;
      }

      /* Navbar link hover effect */
      .nav-link:hover {
        color: #fd7e14 !important;
        font-weight: bold;
      }

      .like-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #6c757d; /* default grey */
      }

      .like-btn .fa-heart {
        font-size: 18px;
      }

      .like-btn.liked {
        color: #e02424; /* red when liked */
        font-weight: 600;
      }

      .like-count {
        font-size: 14px;
      }

      .fav-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #6c757d;
      }

      .fav-btn .fa-bookmark {
        font-size: 18px;
      }

      .fav-btn.favorited {
        color: #fd7e14;
        font-weight: 600;
      }

      .fav-text {
        font-size: 14px;
      }
    </style>
    <link rel="stylesheet" href="../css/foodpapa-pro.css">\n</head>

  <body>
    <nav class="navbar navbar-light bg-white shadow-sm p-3 mb-4 sticky-top">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <div class="d-flex align-items-center">
          <img
            src="../Images/cheif-logo.jpg"
            alt="Logo"
            width="40"
            class="me-2"
          />
          <span class="navbar-brand mb-0 h1 text-orange">FoodPapa</span>
        </div>
        <ul class="nav">
          <li class="nav-item">
            <a class="nav-link text-orange fw-bold" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark" href="./userdishes.html"
              >Dashboard</a
            >
          </li>
        </ul>
        <button onclick="logout()" class="btn btn-orange">Logout</button>
      </div>
    </nav>

    <div class="cart-fixed">
      <div
        class="dish-cart"
        data-bs-toggle="modal"
        data-bs-target="#cartModal"
        style="cursor: pointer"
      >
        <img
          src="https://t3.ftcdn.net/jpg/05/60/17/66/360_F_560176615_cUua21qgzxDiLiiyiVGYjUnLSGnVLIi6.jpg"
        />
        <div class="cart-num">0</div>
      </div>
    </div>

    <main class="container">
      <h2 class="mb-4">
        Our <span style="color: #fd7e14; font-style: italic"> Dishes </span>
      </h2>
      <div id="dishesShowList" class="row"></div>
    </main>

    <div
      class="modal fade"
      id="cartModal"
      tabindex="-1"
      aria-labelledby="cartModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="cartModalLabel">Your Cart</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="cartItemsContainer"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-success" id="placeOrderBtn">
              Place Order
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    
    <script src="../js/foodpapa-motion.js"></script>\n  
  <script type="module" src="../js/userhome-supabase.js"></script>
</body>
</html>
