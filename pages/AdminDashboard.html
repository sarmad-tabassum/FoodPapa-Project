<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      type="x-icon"
      href="../Images/cheif-logo.jpg"
    />
    <title>Admin Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap");

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f5f5;
        color: #2c3e50;
        margin: 0;
        padding: 0;
      }

      .navbar {
        background-color: #ffffff !important;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      .Foodpanda-logo img {
        margin-right: 8px;
      }

      .Foodpanda-logo a {
        font-weight: bold;
        font-size: 1.4rem;
        color: #fd7e14;
        text-decoration: none;
      }

      .nav-link {
        color: #2c3e50 !important;
        font-weight: 500;
      }

      .nav-link.active {
        color: #fd7e14 !important;
      }

      .main-btn,
      .add-btn,
      .btn-primary,
      .btn-warning,
      .btn-danger {
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        transition: all 0.3s ease;
      }

      .main-btn:hover,
      .add-btn:hover,
      .btn-primary:hover,
      .btn-warning:hover,
      .btn-danger:hover {
        background-color: #fd7e14;
        color: #fff;
      }

      #logoutBtn {
        background-color: #fd7e14;
        color: white;
      }

      .admin-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .card {
        border: none;
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }

      .card-title {
        font-weight: 600;
      }

      .card-text {
        font-size: 0.95rem;
        color: #555;
      }

      .modal-content {
        border-radius: 12px;
      }

      .modal-header,
      .modal-footer {
        background-color: #f0f0f0;
      }

      .modal-title {
        color: #2c3e50;
      }

      /* Form elements */
      .form-control {
        border-radius: 6px;
        border: 1px solid #ccc;
        box-shadow: none;
        transition: border 0.3s ease;
      }

      .form-control:focus {
        border-color: #fd7e14;
        box-shadow: 0 0 0 0.1rem rgba(255, 111, 97, 0.25);
      }

      /* Section Headings */
      h3 {
        color: #2c3e50;
        border-bottom: 2px solid #fd7e14;
        padding-bottom: 6px;
        margin-bottom: 16px;
      }

      .navbar-nav {
        gap: 30px;
        font-size: 1rem;
      }

      .navbar-nav .nav-link {
        padding: 8px 12px;
      }

      .Foodpanda-logo {
        display: flex;
        align-items: center;
        margin-left: 50 px;
      }

      .card-text {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card.h-100 {
        display: flex;
        flex-direction: column;
      }

      .card-img-top {
        width: 100%;
        height: 200px; 
        object-fit: contain; 
        background-color: #fff; 
        padding: 10px; 
      }

      .card-body {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .card-text {
        flex-grow: 1;
        overflow: auto;
        max-height: 100px;
      }
    </style>
  </head>

  <body style="background-color: #f7f7f7">
    <nav
      class="navbar navbar-expand-lg navbar-light bg-light cont-2 p-3 sticky-top"
      id="navbarShadow"
    >
      <div class="container-fluid nav">
        <div class="Foodpanda-logo d-flex align-items-center">
          <img
            src="../Images/cheif-logo.jpg"
            alt="Logo"
            width="40"
            class="me-2"
          />
          <span class="navbar-brand mb-0 h1" style="color: #fd7e14"
            >FoodPapa</span
          >
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link fw-bold" href="../pages/AdminHome.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active fw-bold" style="color: #fd7e14" href="#"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark fw-bold" href="../pages/AdminOrder.html"
                >Orders</a
              >
            </li>
          </ul>
          <form class="d-flex">
            <button
              onclick="logout()"
              class="btn"
              style="background-color: #fd7e14"
              type="button"
            >
              Logout
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div
        class="admin-heading d-flex justify-content-between align-items-center"
      >
        <h2 style="font-size: x-large" class="mb-0">
          Admin
          <span style="color: #fd7e14; font-style: italic; font-size: x-large">
            Dashboard...
          </span>
        </h2>
        <button
          class="btn btn-dark"
          data-bs-toggle="modal"
          data-bs-target="#addDishModal"
        >
          Add New Dish
        </button>
      </div>

      <!-- Add Dish Modal -->
      <div class="modal fade" id="addDishModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <form id="addDishForm">
              <div class="modal-header">
                <h5 class="modal-title">Add New Dish</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                ></button>
              </div>
              <div class="modal-body">
                <div class="mb-3">
                  <label for="dishName" class="form-label">Dish Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="dishName"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="dishPrice" class="form-label">Price (PKR)</label>
                  <input
                    type="number"
                    class="form-control"
                    id="dishPrice"
                    min="0"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="dishDescription" class="form-label"
                    >Description</label
                  >
                  <textarea
                    class="form-control"
                    id="dishDescription"
                    rows="4"
                    required
                  ></textarea>
                </div>
                <div class="mb-3">
                  <label for="dishCategory" class="form-label">Category</label>
                  <select class="form-control" id="dishCategory" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="Appetizer">Appetizer</option>
                    <option value="Main Course">Main Course</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Beverage">Beverage</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="dishImageURL" class="form-label"
                    >Dish Image URL</label
                  >
                  <input
                    type="url"
                    class="form-control"
                    id="dishImageURL"
                    required
                  />
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <button type="submit" class="btn btn-primary">Save Dish</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div id="dishesList" class="row mt-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBxU04d9_k9VmPtFDlSpEKH94iUWkrOWKs",
        authDomain: "foodpapa-24729.firebaseapp.com",
        databaseURL: "https://foodpapa-24729-default-rtdb.firebaseio.com",
        projectId: "foodpapa-24729",
        storageBucket: "foodpapa-24729.appspot.com",
        messagingSenderId: "573671343924",
        appId: "1:573671343924:web:71cfccd5064e09bbe50761",
        measurementId: "G-8BMFCXJ60K",
      };

      firebase.initializeApp(firebaseConfig);
      const dishesRef = firebase.database().ref("dishes");

      let currentEditId = null;
      let currentUser = null;

      function logout() {
        Swal.fire({
          title: "Logout?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#fd7e14",
          cancelButtonColor: "#6c757d",
          confirmButtonText: "Yes, logout",
        }).then((result) => {
          if (result.isConfirmed) {
            firebase
              .auth()
              .signOut()
              .then(() => {
                Swal.fire({
                  icon: "success",
                  title: "Logged Out!",
                  text: "You have been logged out successfully.",
                  confirmButtonColor: "#fd7e14",
                }).then(() => {
                  window.location.href = "../index.html";
                });
              });
          }
        });
      }

      firebase.auth().onAuthStateChanged((user) => {
        if (!user) {
          Swal.fire({
            icon: "error",
            title: "Access Denied",
            text: "Please login first to access the Admin Dashboard.",
            confirmButtonColor: "#fd7e14",
          }).then(() => {
            window.location.href = "../index.html";
          });
          return;
        }

        currentUser = user;

        dishesRef.on("value", (snapshot) => {
          const categorizedDishes = {
            Appetizer: [],
            "Main Course": [],
            Dessert: [],
            Beverage: [],
          };

          snapshot.forEach((child) => {
            const dish = child.val();
            if (dish.adminUID === user.uid) {
              categorizedDishes[dish.category].push(dish);
            }
          });

          renderDishesByCategory(categorizedDishes);
        });
      });

      document
        .getElementById("addDishForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const name = document.getElementById("dishName").value;
          const price = document.getElementById("dishPrice").value;
          const description = document.getElementById("dishDescription").value;
          const category = document.getElementById("dishCategory").value;
          const image = document.getElementById("dishImageURL").value;

          if (currentEditId) {
            dishesRef
              .child(currentEditId)
              .update({
                name,
                price,
                description,
                category,
                image,
              })
              .then(() => {
                resetFormAndCloseModal();
                Swal.fire("Updated", "Dish updated successfully!", "success");
                currentEditId = null;
              });
          } else {
            const newDishRef = dishesRef.push();
            const dish = {
              id: newDishRef.key,
              adminUID: currentUser.uid,
              name,
              price,
              description,
              category,
              image,
              timestamp: Date.now(),
            };

            newDishRef.set(dish).then(() => {
              resetFormAndCloseModal();
              Swal.fire("Success", "Dish added successfully!", "success");
            });
          }
        });

      function renderDishesByCategory(dishes) {
        const dishesList = document.getElementById("dishesList");
        dishesList.innerHTML = "";

        Object.keys(dishes).forEach((category) => {
          if (dishes[category].length > 0) {
            const safeId = category.replace(/\s+/g, "-");

            const section = document.createElement("div");
            section.innerHTML = `
        <h3 class="mt-4 mb-3" style="color: black; font-style: italic;">${category}</h3>
        <div class="row" id="${safeId}-row"></div>
      `;
            dishesList.appendChild(section);

            const row = section.querySelector(`#${safeId}-row`);
            dishes[category].forEach((dish) => {
              const col = document.createElement("div");
              col.className = "col-md-4 mb-3";
              col.innerHTML = `
        <div class="card shadow-sm h-100" style="border-radius: 10px; overflow: hidden;">
          <img src="${dish.image}" class="card-img-top" alt="${dish.name}" 
              style="width: 100%; max-height: 200px; object-fit: cover;">
          <div class="card-body d-flex flex-column p-3">
            <h6 class="card-title mb-1" style="font-size: 1rem; font-weight: bold;">${dish.name}</h6>
            <div style="flex: 1; max-height: 60px; overflow-y: auto; font-size: 0.9rem; color: #555;">
              ${dish.description}
            </div>
            <p class="mt-2" style="font-size: 0.9rem;"><strong>Price:</strong> PKR ${dish.price}</p>
            <div class="mt-auto">
              <button class="btn btn-sm btn-warning me-2" onclick="editDish('${dish.id}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteDish('${dish.id}')">Delete</button>
            </div>
          </div>
        </div>
      `;

              row.appendChild(col);
            });
          }
        });
      }

      function editDish(id) {
        dishesRef.child(id).once("value", (snapshot) => {
          const dish = snapshot.val();
          if (dish) {
            currentEditId = id;
            document.getElementById("dishName").value = dish.name;
            document.getElementById("dishPrice").value = dish.price;
            document.getElementById("dishDescription").value = dish.description;
            document.getElementById("dishCategory").value = dish.category;
            document.getElementById("dishImageURL").value = dish.image;

            const modal = new bootstrap.Modal(
              document.getElementById("addDishModal")
            );
            modal.show();
          }
        });
      }

      function deleteDish(id) {
        Swal.fire({
          title: "Are you sure?",
          text: "This dish will be permanently deleted.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#dc3545",
          cancelButtonColor: "#6c757d",
          confirmButtonText: "Yes, delete it!",
        }).then((result) => {
          if (result.isConfirmed) {
            dishesRef
              .child(id)
              .remove()
              .then(() => {
                Swal.fire("Deleted", "Dish has been deleted.", "success");
              });
          }
        });
      }

      function resetFormAndCloseModal() {
        document.getElementById("addDishForm").reset();
        const modal = bootstrap.Modal.getInstance(
          document.getElementById("addDishModal")
        );
        modal.hide();
        currentEditId = null;
      }
    </script>
  </body>
</html>
