<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodPapa | Admin Portal</title><link rel="shortcut icon" href="../Images/cheif-logo.jpg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="../css/foodpapa-pro.css"><style>.sidebar{min-height:100vh;background:linear-gradient(180deg,#171717,#241d18);color:#fff;position:sticky;top:0}.sidebar a{display:block;color:#bbb;text-decoration:none;padding:12px 15px;border-radius:12px;margin:5px 0}.sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.09);color:#fff}.stat{padding:24px;border-radius:22px}.stat i{font-size:24px;color:#ff6b35}.table-card{border-radius:22px;background:rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(20,20,20,.08);padding:22px}</style></head><body><div class="container-fluid"><div class="row"><aside class="col-lg-2 sidebar p-3"><h3 class="mb-4"><i class="fa-solid fa-utensils text-warning"></i> FoodPapa</h3><small class="text-secondary">ADMIN PORTAL</small><a class="active" href="AdminHome-v2.html"><i class="fa-solid fa-chart-line me-2"></i>Overview</a><a href="AdminDashboard-v2.html"><i class="fa-solid fa-bowl-food me-2"></i>Dishes</a><a href="AdminOrder-v2.html"><i class="fa-solid fa-receipt me-2"></i>Orders</a><button id="logout" class="btn btn-outline-light w-100 mt-4">Logout</button></aside><main class="col-lg-10 p-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><span class="text-orange fw-bold">FOODPAPA ADMIN</span><h1 class="mt-1">Operations overview</h1></div><span id="adminEmail" class="text-secondary"></span></div><div class="row g-4 mb-4"><div class="col-md-4"><div class="stat card"><i class="fa-solid fa-bowl-food"></i><div class="text-secondary mt-2">Active dishes</div><h2 id="dishCount">—</h2></div></div><div class="col-md-4"><div class="stat card"><i class="fa-solid fa-bag-shopping"></i><div class="text-secondary mt-2">Orders</div><h2 id="orderCount">—</h2></div></div><div class="col-md-4"><div class="stat card"><i class="fa-solid fa-coins"></i><div class="text-secondary mt-2">Revenue</div><h2 id="revenue">Rs. —</h2></div></div></div><div class="table-card"><div class="d-flex justify-content-between mb-3"><h4>Recent orders</h4><a class="btn btn-orange" href="AdminOrder-v2.html">View all</a></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="orders"></tbody></table></div></div></main></div></div><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module">import{requireAdmin,signOutUser,supabase}from '../js/supabase.js';const money=n=>`Rs. ${Number(n||0).toLocaleString()}`;async function boot(){const auth=await requireAdmin();if(!auth)return;document.getElementById('adminEmail').textContent=auth.user.email||'';const[{count:dishCount},{data:orders,error}]=await Promise.all([supabase.from('dishes').select('*',{count:'exact',head:true}).eq('status','active'),supabase.from('food_orders').select('*').order('created_at',{ascending:false}).limit(8)]);if(error){Swal.fire('Error',error.message,'error');return}document.getElementById('dishCount').textContent=dishCount??0;document.getElementById('orderCount').textContent=orders?.length||0;document.getElementById('revenue').textContent=money((orders||[]).reduce((s,o)=>s+Number(o.total||0),0));document.getElementById('orders').innerHTML=(orders||[]).map(o=>`<tr><td>${o.customer_name||'Customer'}</td><td>${money(o.total)}</td><td><span class="badge text-bg-light text-capitalize">${String(o.status||'').replaceAll('_',' ')}</span></td><td>${new Date(o.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4" class="text-secondary">No orders yet.</td></tr>'}document.getElementById('logout').onclick=()=>signOutUser('AdminSignin.html');boot();</script><script src="../js/foodpapa-motion.js"></script></body></html>
