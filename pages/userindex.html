<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="shortcut icon" type="x-icon" href="../Images/cheif-logo.jpg"><title>FoodPapa | Sign Up</title><link rel="stylesheet" href="../css/foodpapa-pro.css"><style>html,body{height:100%;margin:0}body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:url('../Images/bg-1.jpg') center/cover fixed!important}.Signup{width:90%;max-width:430px;padding:42px;background:rgba(20,20,20,.55);backdrop-filter:blur(20px);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.3)}h1{text-align:center;margin-bottom:34px;font-weight:800}.Signup input{width:100%;box-sizing:border-box;height:46px;background:rgba(255,255,255,.15);color:#fff}.Signup label{display:block;margin:10px 0 6px;font-size:12px;letter-spacing:1.5px}.Signup button{width:100%;height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff6b35,#ff9f43);color:#fff;font-weight:700;margin-top:14px}.Signup a{color:#ff9f43;text-decoration:none}.close-btn{position:absolute;top:20px;right:20px;width:30px;height:30px;cursor:pointer;filter:invert(1)}</style></head><body><div class="Signup"><a href="../index.html"><img class="close-btn" src="../Images/close,cross,no….jpg" alt="Close"></a><h1>Join FoodPapa</h1><label>E-mail</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="new-password" required><button id="signupBtn">Create account</button><p style="text-align:center;margin-top:20px">Already have account? <a href="./userlogin.html">Sign in</a></p></div><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module">import { supabase, friendlyAuthError } from '../js/supabase.js';document.getElementById('signupBtn').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){Swal.fire('Error','Please fill in both fields','error');return}if(password.length<6){Swal.fire('Error','Password should be at least 6 characters.','error');return}const {error}=await supabase.auth.signUp({email,password});if(error){Swal.fire('Error',friendlyAuthError(error),'error');return}Swal.fire({icon:'success',title:'Account Created!',text:'You can now continue to FoodPapa.',showConfirmButton:false,timer:1300}).then(()=>location.href='./userhome.html')});</script><script src="../js/foodpapa-motion.js"></script></body></html>
