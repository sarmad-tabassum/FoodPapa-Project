<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="shortcut icon"
      type="x-icon"
      href="../Images/cheif-logo.jpg"
    />
    <title>Dishes</title>

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #fefefe;
        color: #333;
        margin: 0;
        padding: 0;
      }

      .navbar {
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        background-color: #ffffff !important;
        padding: 1rem 2rem;
      }

      .navbar .nav-link {
        color: #555;
        font-weight: 500;
        margin-right: 1rem;
        transition: color 0.3s ease;
      }

      .navbar .nav-link:hover,
      .navbar .nav-link.active {
        color: #fd7e14;
      }

      .Foodpanda-logo img {
        height: 40px;
        margin-right: 10px;
      }

      .Foodpanda-logo a {
        font-size: 1.5rem;
        font-weight: bold;
        color: #fd7e14;
        text-decoration: none;
      }

      .main-btn {
        background-color: #fd7e14;
        color: #fff;
        border: none;
        padding: 8px 18px;
        border-radius: 6px;
        transition: background-color 0.3s ease;
      }

      .main-btn:hover {
        background-color: #fd7e14;
      }

      .dish-navBottom h2 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: #333;
      }

      .cart-fixed {
        position: fixed;
        top: 100px;
        right: 40px;
        z-index: 1000;
      }

      .dish-cart {
        position: relative;
        background-color: #fff;
        border-radius: 50%;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        padding: 12px;
        transition: transform 0.3s ease;
      }

      .dish-cart:hover {
        transform: scale(1.05);
      }

      .dish-cart img {
        height: 32px;
        width: 32px;
      }

      .cart-num {
        position: absolute;
        top: -8px;
        right: -8px;
        background-color: #fd7e14;
        color: #fff;
        font-size: 12px;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 50%;
      }

      #dishesShowList .card {
        border: none;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        border-radius: 12px;
        margin-bottom: 24px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      #dishesShowList .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      #dishesShowList .card-img-top {
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
        height: 180px;
        object-fit: cover;
      }

      #dishesShowList .card-body h5 {
        font-weight: 600;
        color: #444;
      }

      #dishesShowList .card-body p {
        color: #777;
      }

      #dishesShowList .btn {
        background-color: #fd7e14;
        color: #fff;
        border-radius: 6px;
        padding: 6px 16px;
        transition: background-color 0.3s ease;
      }

      #dishesShowList .btn:hover {
        background-color: #fd7e14;
      }

      #logoutBtn {
        background-color: #fd7e14;
        color: white;
      }

      #loader {
        display: none;
      }

      .card:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        transition: all 0.3s ease-in-out;
      }

      .nav-link:hover {
        color: #fd7e14 !important;
        font-weight: bold;
      }
    </style>
  </head>

  <body style="background-color: #f7f7f7">
    <nav class="navbar navbar-light bg-white shadow-sm p-3 mb-4 sticky-top">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <div class="d-flex align-items-center">
          <img
            src="../Images/cheif-logo.jpg"
            alt="Logo"
            width="40"
            class="me-2"
          />
          <span class="navbar-brand mb-0 h1" style="color: #fd7e14"
            >FoodPapa</span
          >
        </div>
        <ul class="nav">
          <li class="nav-item">
            <a class="nav-link text-dark" href="./userhome.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-bold" style="color: #fd7e14" href="#"
              >Dashboard</a
            >
          </li>
        </ul>
        <button
          onclick="logout()"
          type="button"
          class="btn"
          style="background-color: #fd7e14"
        >
          Logout
        </button>
      </div>
    </nav>

    <div class="container mt-4">
      <h2 class="mb-4">
        Our <span style="color: #fd7e14; font-style: italic"> Dishes </span>
      </h2>
      <div class="cart-fixed">
        <div class="cart-fixed">
          <div
            class="dish-cart"
            data-bs-toggle="modal"
            data-bs-target="#cartModal"
            style="cursor: pointer"
          >
            <img
              src="https://t3.ftcdn.net/jpg/05/60/17/66/360_F_560176615_cUua21qgzxDiLiiyiVGYjUnLSGnVLIi6.jpg"
            />
            <div class="cart-num">0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="container mt-4" style="padding: 0 52px 0 32px">
      <div id="loader" class="text-center my-5">
        <img
          src="https://i.gifer.com/ZZ5H.gif"
          alt="Loading..."
          style="width: 80px"
        />
      </div>
      <div id="dishesShowList" class="mt-4"></div>
    </div>

    <div class="container mt-4" style="padding: 0 52px 0 32px">
      <div id="dishesShowList" class="mt-4"></div>
    </div>

    <div
      class="modal fade"
      id="cartModal"
      tabindex="-1"
      aria-labelledby="cartModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="cartModalLabel">Your Cart</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="cartItemsContainer"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              onclick="placeOrder()"
              class="btn btn-success"
              id="placeOrderBtn"
            >
              Place Order
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      onValue,
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import {
      getAuth,
      signOut,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxU04d9_k9VmPtFDlSpEKH94iUWkrOWKs",
      authDomain: "foodpapa-24729.firebaseapp.com",
      projectId: "foodpapa-24729",
      storageBucket: "foodpapa-24729.appspot.com",
      messagingSenderId: "573671343924",
      appId: "1:573671343924:web:71cfccd5064e09bbe50761",
      measurementId: "G-8BMFCXJ60K",
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    const dishesContainer = document.getElementById("dishesShowList");
    const cartNum = document.querySelector(".cart-num");
    const cartItemsContainer = document.getElementById("cartItemsContainer");
    const placeOrderBtn = document.getElementById("placeOrderBtn");
    const cartModal = document.getElementById("cartModal");

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    onValue(ref(database, "dishes"), (snapshot) => {
      document.getElementById("loader").style.display = "block";
      dishesContainer.innerHTML = "";

      const data = snapshot.val();

      document.getElementById("loader").style.display = "none";

      if (!data) {
        dishesContainer.innerHTML =
          '<p class="text-center">No dishes found.</p>';
        return;
      }

      const groupedDishes = {};
      Object.entries(data).forEach(([id, dish]) => {
        const category = dish.category || "Uncategorized";
        if (!groupedDishes[category]) groupedDishes[category] = [];
        groupedDishes[category].push({ id, ...dish });
      });

      for (const [categoryName, dishes] of Object.entries(groupedDishes)) {
        const categorySection = document.createElement("div");
        categorySection.classList.add("mb-5");

        categorySection.innerHTML = `
            <h3 style="color: black; font-style: italic;">${categoryName}</h3>
            <hr style="border: 2px solid #fd7e14; margin-top: 5px; margin-bottom: 25px;">
        `;

        const row = document.createElement("div");
        row.className = "row";

        dishes.forEach((dish) => {
          const col = document.createElement("div");
          col.className = "col-md-4 mb-4";
          col.innerHTML = `
                <div class="card shadow-sm h-100">
                    <img src="${
                      dish.image
                    }" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${
            dish.name
          }">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title">${dish.name}</h5>
                            <p class="card-text fw-bold text-orange">Rs. ${
                              dish.price
                            }</p>
                        </div>
                        <button class="btn btn-orange mt-3 w-100" 
                            onclick='addToCart("${dish.id}", ${JSON.stringify(
            dish
          )})'>
                            Add to Cart
                        </button>
                    </div>
                </div>
            `;
          row.appendChild(col);
        });

        categorySection.appendChild(row);
        dishesContainer.appendChild(categorySection);
      }
    });

    window.addToCart = (id, dish) => {
      const existing = cart.find((item) => item.id === id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ id, ...dish, quantity: 1 });
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      Swal.fire({
        icon: "success",
        title: "Added to cart!",
        text: `${dish.name} added.`,
        timer: 1500,
        showConfirmButton: false,
      });
      updateCartCount();
    };

    function updateCartCount() {
      cart = JSON.parse(localStorage.getItem("cart")) || [];
      cartNum.textContent = cart.length;
    }
    updateCartCount();

    function renderCartModal() {
      cart = JSON.parse(localStorage.getItem("cart")) || [];
      cartItemsContainer.innerHTML = "";
      if (cart.length === 0) {
        cartItemsContainer.innerHTML =
          '<p class="text-center">Your cart is empty.</p>';
        placeOrderBtn.style.display = "none";
        return;
      }
      placeOrderBtn.style.display = "inline-block";

      cart.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "d-flex align-items-center mb-3 border-bottom pb-2";
        div.innerHTML = `
                <img src="${item.image}" alt="${item.name}" style="width: 80px; height: 80px; object-fit: cover;" class="me-3 rounded">
                <div class="flex-grow-1">
                    <h6 class="mb-1">${item.name}</h6>
                    <p class="mb-0 text-muted">Rs. ${item.price} x ${item.quantity}</p>
                </div>
                <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">Remove</button>
            `;
        cartItemsContainer.appendChild(div);
      });
    }

    window.removeFromCart = (index) => {
      Swal.fire({
        title: "Are you sure?",
        text: "You want to remove this item from cart?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "Yes, remove it!",
      }).then((result) => {
        if (result.isConfirmed) {
          cart.splice(index, 1);
          localStorage.setItem("cart", JSON.stringify(cart));
          updateCartCount();
          renderCartModal();

          Swal.fire({
            icon: "success",
            title: "Removed!",
            text: "Item has been removed from your cart.",
            timer: 1200,
            showConfirmButton: false,
          });
        }
      });
    };
    window.placeOrder = () => {
      const user = auth.currentUser;
      if (!user) {
        Swal.fire({
          icon: "error",
          title: "Not logged in!",
          text: "Please log in to place an order.",
        });
        return;
      }
      if (cart.length === 0) {
        Swal.fire({
          icon: "warning",
          title: "Cart is empty",
          text: "Please add items to your cart first!",
        });
        return;
      }

      const orderRef = push(ref(database, `orders/${user.uid}`));
      const orderData = {
        items: cart,
        timestamp: Date.now(),
        email: user.email,
        username: user.displayName || "Unknown User",
      };

      set(orderRef, orderData)
        .then(() => {
          Swal.fire({
            icon: "success",
            title: "Order Placed!",
            text: "Your order has been successfully submitted!",
            timer: 2000,
            showConfirmButton: false,
          });

          cart = [];
          localStorage.removeItem("cart");
          updateCartCount();
          renderCartModal();
        })
        .catch((error) => {
          console.error("Order failed:", error);
          Swal.fire({
            icon: "error",
            title: "Error placing order",
            text: error.message,
          });
        });
    };

    cartModal.addEventListener("show.bs.modal", renderCartModal);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        Swal.fire({
          icon: "error",
          title: "Access Denied",
          text: "Please log in to continue.",
          confirmButtonColor: "#fd7e14",
        }).then(() => {
          window.location.href = "../index.html";
        });
      }
    });

    window.logout = function () {
      Swal.fire({
        title: "Logout?",
        text: "Are you sure you want to logout?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#fd7e14",
        cancelButtonColor: "#6c757d",
        confirmButtonText: "Yes, logout",
      }).then((result) => {
        if (result.isConfirmed) {
          signOut(auth)
            .then(() => {
              localStorage.clear();
              Swal.fire({
                icon: "success",
                title: "Logged Out!",
                showConfirmButton: false,
                timer: 1500,
              });
              setTimeout(
                () => (window.location.href = "../index.html"),
                1500
              );
            })
            .catch((error) => {
              Swal.fire({
                icon: "error",
                title: "Logout failed",
                text: error.message,
              });
            });
        }
      });
    };
  </script>
</html>
