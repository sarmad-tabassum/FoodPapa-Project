<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodPapa | Orders</title><link rel="shortcut icon" href="../Images/cheif-logo.jpg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="../css/foodpapa-pro.css"><style>.sidebar{min-height:100vh;background:linear-gradient(180deg,#171717,#241d18);color:#fff;position:sticky;top:0}.sidebar a{display:block;color:#bdb8b3;text-decoration:none;padding:12px 14px;border-radius:14px;margin:5px 0}.sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.09);color:#fff}.order-card{padding:22px}.order-total{font-size:22px;font-weight:800}.status-select{min-width:150px}</style></head>
<body><div class="container-fluid"><div class="row g-0"><aside class="col-lg-2 sidebar p-3"><h3 class="border-0 text-white mb-4"><i class="fa-solid fa-utensils text-warning me-2"></i>FoodPapa</h3><small class="text-secondary">ADMIN PORTAL</small><a href="AdminHome-v2.html"><i class="fa-solid fa-chart-line me-2"></i>Overview</a><a href="AdminDashboard-v2.html"><i class="fa-solid fa-bowl-food me-2"></i>Dishes</a><a class="active" href="AdminOrder-v2.html"><i class="fa-solid fa-receipt me-2"></i>Orders</a><button id="logout" class="btn btn-outline-light w-100 mt-4">Logout</button></aside><main class="col-lg-10 p-3 p-lg-5"><div class="d-flex flex-wrap justify-content-between align-items-center mb-4"><div><span class="text-orange fw-bold">FOODPAPA ADMIN</span><h1 class="mb-0">Orders</h1></div><select id="filter" class="form-select" style="max-width:190px"><option value="">All orders</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="preparing">Preparing</option><option value="out_for_delivery">Out for delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div id="orders" class="row g-4"></div></main></div></div><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module">import{requireAdmin,signOutUser,supabase}from '../js/supabase.js';let all=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>`Rs. ${Number(n||0).toLocaleString()}`;const statusLabel=s=>String(s||'pending').replaceAll('_',' ');async function load(){const{data,error}=await supabase.from('food_orders').select('*').order('created_at',{ascending:false});if(error){Swal.fire('Error',error.message,'error');return}all=data||[];render()}function render(){const filter=document.getElementById('filter').value;const rows=all.filter(o=>!filter||o.status===filter);document.getElementById('orders').innerHTML=rows.map(o=>`<div class="col-xl-6"><article class="card order-card h-100"><div class="d-flex justify-content-between gap-3"><div><div class="text-secondary small">${new Date(o.created_at).toLocaleString()}</div><h5 class="mt-1 mb-1">${esc(o.customer_name||'Customer')}</h5><div class="text-secondary small">${esc(o.customer_email||'')}</div></div><div class="text-end"><div class="order-total text-orange">${money(o.total)}</div><div class="small text-secondary">${esc(o.id.slice(0,8))}</div></div></div><hr><div class="d-flex justify-content-between align-items-center gap-3"><span class="badge text-bg-light text-capitalize">${esc(statusLabel(o.status))}</span><select class="form-select status-select" data-status="${o.id}"><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="preparing">Preparing</option><option value="out_for_delivery">Out for delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div class="mt-3 small text-secondary">Shipping: ${esc(JSON.stringify(o.shipping_address||{}))}</div></article></div>`).join('')||'<div class="col-12"><div class="card p-5 text-center text-secondary">No orders found.</div></div>';rows.forEach(o=>{const el=document.querySelector(`[data-status="${o.id}"]`);if(el)el.value=o.status})}document.getElementById('filter').onchange=render;document.getElementById('orders').onchange=async e=>{const el=e.target.closest('[data-status]');if(!el)return;const{error}=await supabase.from('food_orders').update({status:el.value,updated_at:new Date().toISOString()}).eq('id',el.dataset.status);if(error)Swal.fire('Error',error.message,'error');else{const o=all.find(x=>x.id===el.dataset.status);if(o)o.status=el.value;Swal.fire({icon:'success',title:'Status updated',timer:800,showConfirmButton:false});render()}};document.getElementById('logout').onclick=()=>signOutUser('AdminSignin.html');const admin=await requireAdmin();if(admin)load();</script><script src="../js/foodpapa-motion.js"></script></body></html>
