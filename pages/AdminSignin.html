<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="shortcut icon" type="x-icon" href="../Images/cheif-logo.jpg"><title>FoodPapa | Admin Login</title><link rel="stylesheet" href="../css/foodpapa-pro.css"><style>html,body{height:100%;margin:0}body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:url('../Images/header.jpg') center/cover fixed!important}.login{width:90%;max-width:430px;padding:42px;background:rgba(15,15,15,.62);backdrop-filter:blur(22px);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.35)}h1{text-align:center;margin-bottom:34px;font-weight:800}.login input{width:100%;box-sizing:border-box;height:46px;background:rgba(255,255,255,.15);color:#fff}.login label{display:block;margin:10px 0 6px;font-size:12px;letter-spacing:1.5px}.login button{width:100%;height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff6b35,#ff9f43);color:#fff;font-weight:700;margin-top:14px}.login a{color:#ff9f43;text-decoration:none}.close-btn{position:absolute;top:20px;right:20px;width:30px;height:30px;cursor:pointer;filter:invert(1)}</style></head><body><div class="login"><a href="../index.html"><img class="close-btn" src="../Images/close,cross,no….jpg" alt="Close"></a><h1>Admin Portal</h1><label>E-mail</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submitBtn">Sign in securely</button><p style="text-align:center;margin-top:20px">Admin access is restricted to authorized accounts.</p></div><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module">import { supabase, getProfile, friendlyAuthError } from '../js/supabase.js';document.getElementById('submitBtn').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){Swal.fire('Error','Please fill in both fields','error');return}const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){Swal.fire('Error',friendlyAuthError(error),'error');return}const profile=await getProfile(data.user.id);if(profile?.role!=='admin'){await supabase.auth.signOut();Swal.fire('Access denied','This account is not an administrator.','error');return}Swal.fire({icon:'success',title:'Admin Login Successful',showConfirmButton:false,timer:1100}).then(()=>location.href='./AdminHome.html')});</script><script src="../js/foodpapa-motion.js"></script></body></html>
