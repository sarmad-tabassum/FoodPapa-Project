<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="x-icon" href="../Main/Images/cheif-logo.jpg">
    <title>SignUp Form</title>
    <style>
        body {
            background-color: grey;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .login {
            border: 1px solid black;
            width: 90%; 
            max-width: 400px; 
           background: url('../Images/header.jpg');
            color: white;
            border-radius: 20px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.75);
            background-size: cover;
            background-position: center;
            overflow: hidden;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            font-weight: normal;
            font-size: 24px;
            text-shadow: 0px 0px 2px rgba(0, 0, 0, 0.5);
            margin-bottom: 60px;
            text-align: center;
        }

        label {
            color: white;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 2px;
            padding-left: 10px;
            padding-right: 10px;
        }

        input {
            background: rgba(255, 255, 255, 0.3);
            height: 40px;
            line-height: 40px;
            border-radius: 20px;
            padding: 0px 20px;
            border: none;
            margin-bottom: 20px;
            color: white;
            width: 100%; 
            padding-right: 0px;
        }

        button {
            background: #ff7f50; 
            height: 40px;
            line-height: 40px;
            border-radius: 40px;
            border: none;
            margin: 10px 0px;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.3);
            color: white;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #c0552e; 
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: none;
            border: none;
            filter: invert(100%);
        }

        
    </style>
</head>
<body id="Home">
    <center>
    <div class="login">
        <a href="../index.html"><img class="close-btn" src="../Images/close,cross,no….jpg" alt=""></a>
        <h1>Sign up</h1>
        <label>E-mail</label>
        <input id="email" type="email" required>
        <label>Password</label>
        <input id="password" type="password" required>
        <button id="submitBtn">Submit</button>
    <br>  
    <p>Alraedy have account? <a  style="text-decoration: none;color: #ff7f50;" href="./AdminSignin.html">Sign in</a></p>
</center>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxU04d9_k9VmPtFDlSpEKH94iUWkrOWKs",
      authDomain: "foodpapa-24729.firebaseapp.com",
      projectId: "foodpapa-24729",
      storageBucket: "foodpapa-24729.appspot.com",
      messagingSenderId: "573671343924",
      appId: "1:573671343924:web:71cfccd5064e09bbe50761",
      measurementId: "G-8BMFCXJ60K"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

   window.addEventListener("DOMContentLoaded", function () {
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.addEventListener("click", () => {
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    if (!emailInput || !passwordInput) {
      Swal.fire("Error", "Form inputs not found in DOM.", "error");
      return;
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    console.log("Email:", email);
    console.log("Password:", password);

    if (!email || !password) {
      Swal.fire("Error", "Please enter both email and password.", "error");
      return;
    }

    createUserWithEmailAndPassword(auth, email, password)
      .then(() => {
        Swal.fire({
          icon: "success",
          title: "Account Created!",
          showConfirmButton: false,
          timer: 1500,
        }).then(() => {
          window.location.href = "./AdminHome.html";
        });
      })
      .catch((error) => {
  let message = "Something went wrong!";
  
  if (error.code === 'auth/email-already-in-use') {
    message = "Already have an account.";
  } else if (error.code === 'auth/invalid-email') {
    message = "Invalid email format.";
  } else if (error.code === 'auth/weak-password') {
    message = "Password should be at least 6 characters.";
  }

  Swal.fire("Error", message, "error");
});


  });
});

  </script>


</html>
