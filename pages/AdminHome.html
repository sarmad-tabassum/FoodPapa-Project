    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap");
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f5f5;
        color: #2c3e50;
        margin: 0;
        padding: 0;
      }
      .text-orange {
        color: #fd7e14;
      }
      .btn-orange {
        background-color: #fd7e14;
        color: white;
      }
      .btn-orange:hover {
        background-color: #e96b00;
      }
      .dish-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .dish-card img {
        height: 200px;
        width: 100%;
        object-fit: cover;
      }
      .dish-card .card-body {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .dish-description {
        flex-grow: 1;
        max-height: 60px;
        overflow-y: auto;
      }

      .navbar {
        background-color: #ffffff !important;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      .Foodpanda-logo img {
        margin-right: 8px;
      }

      .Foodpanda-logo a {
        font-weight: bold;
        font-size: 1.4rem;
        color: #fd7e14;
        text-decoration: none;
      }

      .nav-link {
        color: #2c3e50 !important;
        font-weight: 500;
      }

      .main-btn,
      .add-btn,
      .btn-primary,
      .btn-warning,
      .btn-danger {
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        transition: all 0.3s ease;
      }

      .main-btn:hover,
      .add-btn:hover,
      .btn-primary:hover,
      .btn-warning:hover,
      .btn-danger:hover {
        background-color: #fd7e14;
        color: #fff;
      }

      #logoutBtn {
        background-color: #fd7e14;
        color: white;
      }

      .admin-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .card {
        border: none;
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }

      .card-title {
        font-weight: 600;
      }

      .card-text {
        font-size: 0.95rem;
        color: #555;
      }

      .modal-content {
        border-radius: 12px;
      }

      .modal-header,
      .modal-footer {
        background-color: #f0f0f0;
      }

      .modal-title {
        color: #2c3e50;
      }

      .form-control {
        border-radius: 6px;
        border: 1px solid #ccc;
        box-shadow: none;
        transition: border 0.3s ease;
      }

      .form-control:focus {
        border-color: #fd7e14;
        box-shadow: 0 0 0 0.1rem rgba(255, 111, 97, 0.25);
      }

      h3 {
        color: #2c3e50;
        border-bottom: 2px solid #fd7e14;
        padding-bottom: 6px;
        margin-bottom: 16px;
      }

      .navbar-nav {
        gap: 30px;
        font-size: 1rem;
      }

      .navbar-nav .nav-link {
        padding: 8px 12px;
      }

      .Foodpanda-logo {
        display: flex;
        align-items: center;
        margin-left: 50 px;
      }

      .card-text {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card.h-100 {
        display: flex;
        flex-direction: column;
      }

      .card-img-top {
        height: 250px;
        object-fit: cover;
      }

      .card-body {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .card-text {
        flex-grow: 1;
        overflow: auto;
        max-height: 100px;
      }
    </style>
    <link rel="stylesheet" href="../css/foodpapa-pro.css">\n</head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-light bg-light cont-2 p-3 sticky-top"
      id="navbarShadow"
    >
      <div class="container-fluid nav">
        <div class="Foodpanda-logo d-flex align-items-center">
          <img
            src="../Images/cheif-logo.jpg"
            alt="Logo"
            width="40"
            class="me-2"
          />
          <span class="navbar-brand mb-0 h1" style="color: #fd7e14"
            >FoodPapa</span
          >
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-20">
            <li class="nav-item">
              <a
                class="nav-link fw-bold"
                style="color: #fd7e14 !important"
                href="#"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active fw-bold"
                href="../pages/AdminDashboard.html"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark fw-bold" href="../pages/AdminOrder.html"
                >Orders</a
              >
            </li>
          </ul>
          <form class="d-flex">
            <button
              onclick="logout()"
              class="btn"
              style="background-color: #fd7e14"
              type="button"
            >
              Logout
            </button>
          </form>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-size: x-large">
          Welcome <span style="color: #fd7e14; font-style: italic">Admin!</span>
        </h2>
      </div>

      <div class="row text-center mb-5">
        <div class="col-md-4">
          <div class="card shadow-sm p-3">
            <h5>Total Dishes</h5>
            <p id="totalDishes" class="fw-bold fs-4 text-orange">0</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm p-3">
            <h5>Categories</h5>
            <p id="totalCategories" class="fw-bold fs-4 text-orange">0</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm p-3">
            <h5>Recent Add</h5>
            <p id="recentDish" class="fw-bold fs-5 text-secondary">No data</p>
          </div>
        </div>
      </div>

      <div id="dishesContainer"></div>
    </main>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBxU04d9_k9VmPtFDlSpEKH94iUWkrOWKs",
        authDomain: "foodpapa-24729.firebaseapp.com",
        databaseURL: "https://foodpapa-24729-default-rtdb.firebaseio.com/",
        projectId: "foodpapa-24729",
        storageBucket: "foodpapa-24729.appspot.com",
        messagingSenderId: "573671343924",
        appId: "1:573671343924:web:71cfccd5064e09bbe50761",
        measurementId: "G-8BMFCXJ60K",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const auth = firebase.auth();

      const totalDishesEl = document.getElementById("totalDishes");
      const totalCategoriesEl = document.getElementById("totalCategories");
      const recentDishEl = document.getElementById("recentDish");
      const dishesContainer = document.getElementById("dishesContainer");

      function loadSummaryAndDishes() {
        db.ref("dishes").once("value", (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const dishes = Object.entries(data).map(([id, dish]) => ({
              id,
              ...dish,
            }));
            const categories = new Set(dishes.map((d) => d.category));

            totalDishesEl.innerText = dishes.length;
            totalCategoriesEl.innerText = categories.size;

            const sorted = dishes.sort((a, b) => b.timestamp - a.timestamp);
            recentDishEl.innerText = sorted[0].name || "N/A";

            const categoryMap = {};
            dishes.forEach((dish) => {
              if (!categoryMap[dish.category]) categoryMap[dish.category] = [];
              categoryMap[dish.category].push(dish);
            });

            dishesContainer.innerHTML = "";
            Object.keys(categoryMap).forEach((category) => {
              const categorySection = document.createElement("div");
              categorySection.innerHTML = `
    <h3 class="mt-4 mb-3" style="color: black; font-style: italic;">${category}</h3>
    <div class="row">
      ${categoryMap[category]
        .map(
          (dish) => `
        <div class="col-md-4">
          <div class="dish-card shadow-sm">
            <img src="${dish.image}" alt="${dish.name}">
            <div class='card-body p-2'> 
              <h5 class="d-flex justify-content-between align-items-center">
                ${dish.name}
                 <button class="btn btn-sm btn-light" onclick="toggleLike('${
                   dish.id
                 }')">
                   <i id="heart-${dish.id}" class="fa-regular fa-heart"></i>
                   <span id="likes-${dish.id}">${dish.likes || 0}</span>
                 </button>
              </h5>
              <p><strong>Price:</strong> ${dish.price}</p>
              <p class="dish-description"><strong>Description:</strong> ${
                dish.description
              }</p>
            </div>
          </div>
        </div>
      `
        )
        .join("")}
    </div>
  `;
              dishesContainer.appendChild(categorySection);
            });
          } else {
            totalDishesEl.innerText = 0;
            totalCategoriesEl.innerText = 0;
            recentDishEl.innerText = "No data";
            dishesContainer.innerHTML =
              "<p class='text-center text-muted'>No dishes found.</p>";
          }
        });
      }

      function toggleLike(dishId) {
        const userId = auth.currentUser?.uid;
        if (!userId) {
          Swal.fire({
            icon: "warning",
            title: "Login Required",
            text: "Please login to like dishes.",
            confirmButtonColor: "#fd7e14",
          });
          return;
        }

        const dishRef = db.ref(`dishes/${dishId}`);
        dishRef.once("value").then((snapshot) => {
          if (snapshot.exists()) {
            const dish = snapshot.val();
            let likes = dish.likes || 0;
            let likedBy = dish.likedBy || {};

            if (likedBy[userId]) {
              likes = likes - 1;
              delete likedBy[userId];
              document.getElementById(`heart-${dishId}`).className =
                "fa-regular fa-heart";
            } else {
              likes = likes + 1;
              likedBy[userId] = true;
              document.getElementById(`heart-${dishId}`).className =
                "fa-solid fa-heart text-danger";
            }

            dishRef.update({ likes, likedBy });

            document.getElementById(`likes-${dishId}`).textContent = likes;
          }
        });
      }

      function logout() {
        Swal.fire({
          title: "Logout?",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#fd7e14",
          cancelButtonColor: "#6c757d",
          confirmButtonText: "Yes, logout",
        }).then((result) => {
          if (result.isConfirmed) {
            firebase
              .auth()
              .signOut()
              .then(() => {
                Swal.fire({
                  icon: "success",
                  title: "Logged Out!",
                  text: "You have been logged out successfully.",
                  confirmButtonColor: "#fd7e14",
                }).then(() => {
                  window.location.href = "../index.html";
                });
              });
          }
        });
      }

      auth.onAuthStateChanged((user) => {
        if (!user) {
          Swal.fire({
            icon: "error",
            title: "Access Denied",
            text: "Please login first to access the Admin Dashboard.",
            confirmButtonColor: "#fd7e14",
          }).then(() => {
            window.location.href = "../index.html";
          });
        } else {
          loadSummaryAndDishes();
        }
      });
    </script>
    <script src="../js/foodpapa-motion.js"></script>\n</body>
</html>
