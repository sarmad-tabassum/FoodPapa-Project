name: FoodPapa Pro Upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply shared visual system
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          pages = list(root.glob('*.html')) + list((root / 'pages').glob('*.html'))

          for path in pages:
              text = path.read_text(encoding='utf-8')
              css = 'css/foodpapa-pro.css' if path.parent == root else '../css/foodpapa-pro.css'
              motion = 'js/foodpapa-motion.js' if path.parent == root else '../js/foodpapa-motion.js'

              if 'foodpapa-pro.css' not in text:
                  text = text.replace('</head>', f'  <link rel="stylesheet" href="{css}">\\n</head>', 1)
              if 'foodpapa-motion.js' not in text:
                  text = text.replace('</body>', f'  <script src="{motion}"></script>\\n</body>', 1)

              path.write_text(text, encoding='utf-8')

      - name: Commit visual upgrade
        run: |
          git config user.name 'foodpapa-upgrade[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: apply professional 3D UI across FoodPapa pages'
          git push
